services:
  mock-ws:
    image: python:3.12-alpine
    command: python3 /srv/server.py
    environment:
      MOCK_WS_PORT: "9099"
      MOCK_WS_REPORT: /shared/mock-report.json
    volumes:
      - ./mock_ws_server/server.py:/srv/server.py:ro
      - report:/shared

  freeswitch:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - mock-ws
    volumes:
      - ./dialplan/rig.xml:/etc/freeswitch/dialplan/default/00_rig.xml:ro
      - report:/shared
    command: freeswitch -nc -nonat -nosql

  smoke:
    image: alpine:edge
    depends_on:
      - freeswitch
    environment:
      MOCK_WS_URL: ws://mock-ws:9099/
      MOCK_WS_REPORT: /shared/mock-report.json
      CALLS: "50"
    volumes:
      - ./smoke.sh:/srv/smoke.sh:ro
      - report:/shared
    # shares the FreeSWITCH network namespace so fs_cli reaches 127.0.0.1:8021
    network_mode: service:freeswitch
    command: >
      sh -c "echo 'https://dl-cdn.alpinelinux.org/alpine/edge/community' >> /etc/apk/repositories &&
             apk add --no-cache freeswitch &&
             sh /srv/smoke.sh"

volumes:
  report:
