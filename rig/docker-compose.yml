x-module-image: &module-image
  build:
    context: ..
    dockerfile: Dockerfile
  image: ${AUDIOFORK_IMAGE:-afrig-freeswitch}

services:
  mock-ws:
    image: python:3.12-alpine
    command: python3 /srv/server.py
    environment:
      MOCK_WS_PORT: "9099"
      MOCK_WS_REPORT: /shared/mock-report.json
      MOCK_WS_PLAYBACK_MS: "2000"
    volumes:
      - ./mock_ws_server/server.py:/srv/server.py:ro
      - report:/shared

  # The same server over TLS. Its credentials come from net/tests/tls, so one
  # generator (net/tests/tls/regen.sh) serves both the unit suite and the rig.
  mock-wss:
    image: python:3.12-alpine
    command: python3 /srv/server.py
    environment:
      MOCK_WS_PORT: "9443"
      MOCK_WS_REPORT: /shared/mock-wss-report.json
      MOCK_WS_TLS_CERT: /srv/tls/server.pem
      MOCK_WS_TLS_KEY: /srv/tls/server.key
    volumes:
      - ./mock_ws_server/server.py:/srv/server.py:ro
      - ../net/tests/tls:/srv/tls:ro
      - report:/shared

  freeswitch:
    <<: *module-image
    depends_on:
      - mock-ws
      - mock-wss
    volumes:
      # Alpine's freeswitch package ships no usable configuration, so the rig
      # brings its own whole tree.
      - ./conf:/etc/freeswitch:ro
      # Included by an absolute path from rig/conf/freeswitch.xml: the repo copy
      # is the module's only config source of truth. The entrypoint substitutes
      # the container-local CA path into it before FreeSWITCH starts.
      - ../conf/audio_fork.conf.xml:/srv/audio_fork.conf.xml.in:ro
      - ./freeswitch-entrypoint.sh:/srv/freeswitch-entrypoint.sh:ro
      - ../net/tests/tls:/srv/tls:ro
      - report:/shared
    # -nc daemonizes and PID 1 exits immediately; -nf keeps it in the foreground
    command: ["sh", "/srv/freeswitch-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -H 127.0.0.1 -x 'audio_fork status' | grep -q forks"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  smoke:
    <<: *module-image
    depends_on:
      freeswitch:
        condition: service_healthy
    environment:
      MOCK_WS_URL: ws://mock-ws:9099/
      MOCK_WS_REPORT: /shared/mock-report.json
      MOCK_WS_PLAYBACK_MS: "2000"
      CALLS: "${CALLS:-50}"
      MOCK_WSS_URL: wss://mock-wss:9443/
      MOCK_WSS_REPORT: /shared/mock-wss-report.json
    volumes:
      - ./smoke.sh:/srv/smoke.sh:ro
      - report:/shared
    # shares the FreeSWITCH network namespace so fs_cli reaches 127.0.0.1:8021
    network_mode: service:freeswitch
    entrypoint: ["sh", "/srv/smoke.sh"]

volumes:
  report:
