name: soak

# GitHub-hosted runners cap a job at 6 hours, so the 48h release gate only runs
# on a self-hosted runner in the `soak` group.
on:
  workflow_dispatch:
    inputs:
      soak_hours:
        description: hours of continuous churn
        default: "48"
      concurrent:
        description: concurrent calls held throughout
        default: "800"
      hold_seconds:
        description: how long each call stays up
        default: "60"

jobs:
  soak:
    runs-on: [self-hosted, soak]
    timeout-minutes: 3120
    steps:
      - uses: actions/checkout@v4
      - name: continuous churn with flat RSS and fd curves
        env:
          SOAK_HOURS: ${{ inputs.soak_hours }}
          CONCURRENT: ${{ inputs.concurrent }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: ./rig/load/run_soak.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-logs
          path: rig-logs/
