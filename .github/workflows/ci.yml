name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan, release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel
      - run: ctest --preset ${{ matrix.preset }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: CC=clang CXX=clang++ cmake --preset fuzz
      - run: cmake --build --preset fuzz --parallel --target protocol_fuzz
      - run: |
          mkdir -p /tmp/fuzz-scratch
          ./build/fuzz/core/tests/protocol_fuzz -runs=200000 -max_len=4096 -timeout=10 \
            /tmp/fuzz-scratch core/tests/fuzz/corpus

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - run: cmake --preset debug
      - run: run-clang-tidy -p build/debug -quiet 'core/(src|tests)/.*\.cpp'
