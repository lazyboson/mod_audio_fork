name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan, release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel
      - run: ctest --preset ${{ matrix.preset }}

  module:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: alpine:edge
    steps:
      - run: |
          echo "https://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
          apk add --no-cache build-base cmake git pkgconf linux-headers \
            freeswitch-dev openssl-dev zlib-dev
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - name: build the module against FreeSWITCH headers
        run: |
          cmake -S . -B build/module -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DAUDIOFORK_BUILD_MODULE=ON
          cmake --build build/module --parallel
      - name: the module must export the FreeSWITCH interface and no lws symbols
        run: |
          nm -D --defined-only build/module/module/mod_audio_fork.so > exported.txt
          grep -q mod_audio_fork_module_interface exported.txt
          if grep -q ' lws_' exported.txt; then
            echo "vendored libwebsockets symbols leaked into the module" >&2
            exit 1
          fi

  rig-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 50-call smoke, audio integrity and a clean FreeSWITCH shutdown
        run: ./rig/run_smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rig-smoke-logs
          path: rig-logs.txt

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: CC=clang CXX=clang++ cmake --preset fuzz
      - run: cmake --build --preset fuzz --parallel --target protocol_fuzz
      - run: |
          mkdir -p /tmp/fuzz-scratch
          ./build/fuzz/core/tests/protocol_fuzz -runs=200000 -max_len=4096 -timeout=10 \
            /tmp/fuzz-scratch core/tests/fuzz/corpus

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - run: cmake --preset debug
      - run: run-clang-tidy -p build/debug -quiet 'core/(src|tests)/.*\.cpp'
